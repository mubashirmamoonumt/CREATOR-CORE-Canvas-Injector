<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050a06;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      font-size: 12px;
    }
    .header-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
    h2 { font-size: 15px; color: #10b981; }
    .sub { font-size: 10px; color: #6ee7b7; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    
    .gear-btn {
      background: #0d1f12; border: 1px solid #1a3821; color: #94a3b8;
      border-radius: 4px; padding: 3px 6px; cursor: pointer; font-size: 11px;
    }
    .gear-btn:hover { color: #10b981; border-color: #10b981; }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #0d1f12;
      border: 1px solid #1a3821;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .badge { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; margin-right: 5px; }
    .badge.on { background: #10b981; box-shadow: 0 0 6px #10b981; }

    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 7px; background: #0c180e; border: 1px solid #1a3821;
      color: #94a3b8; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 11px;
    }
    .tab.active { background: #10b981; color: #050a06; border-color: #10b981; }

    .field { margin-bottom: 10px; }
    label { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
    textarea, select, input[type="text"] {
      width: 100%; background: #08120a; border: 1px solid #1b3d24; color: #f1f5f9;
      padding: 6px; border-radius: 5px; font-size: 12px; outline: none;
    }
    textarea:focus, select:focus, input[type="text"]:focus { border-color: #10b981; }

    .btn {
      width: 100%; padding: 9px; background: #10b981; color: #050a06;
      border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 4px;
    }
    .btn:hover { background: #34d399; }

    .btn-danger {
      width: 100%; padding: 10px; background: #ef4444; color: #ffffff;
      border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .btn-danger:hover { background: #dc2626; }

    .log-container { margin-top: 10px; }
    .log {
      background: #030604; border: 1px solid #142a1a; border-radius: 5px;
      padding: 6px; height: 90px; overflow-y: auto; font-family: monospace;
      font-size: 10px; color: #a7f3d0; white-space: pre-wrap;
    }

    .automation-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
    }
    .circle-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .circle-bg {
      fill: none;
      stroke: #1f2937;
      stroke-width: 8;
      stroke-dasharray: 4, 8;
    }
    .circle-progress {
      fill: none;
      stroke: #10b981;
      stroke-width: 8;
      stroke-dasharray: 4, 8;
    }
    .circle-wrapper.spinning .circle-svg {
      animation: spin 3s linear infinite;
    }

    .circle-center-text {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .circle-count {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }
    .circle-status-text {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .counter-details {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 14px;
      background: #08120a;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #142a1a;
    }
    .counter-item { text-align: center; }
    .counter-item .c-title { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .counter-item .c-val { font-size: 14px; color: #10b981; font-weight: 700; }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100;
    }
    .modal-card {
      background: #0d1f12; border: 1px solid #10b981; border-radius: 8px;
      padding: 14px; width: 100%; max-width: 300px;
    }

    .hidden { display: none !important; }

    @keyframes spin {
      100% { transform: rotate(270deg); }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h2>Gemini Bridge</h2>
      <div class="sub">Creator Core Canvas Injector</div>
    </div>
    <button id="openSettingsBtn" class="gear-btn">⚙ Settings</button>
  </div>

  <div class="status">
    <div><span id="dot" class="badge"></span><span id="stext">Relay: Checking...</span></div>
    <span id="modetext" style="color:#10b981; font-weight:600;">MANUAL</span>
  </div>

  <div class="tabs">
    <button class="tab active" id="btnManual">Manual Test</button>
    <button class="tab" id="btnAuto">Automation</button>
  </div>

  <!-- Manual Mode Form -->
  <div id="manualContainer">
    <div class="field">
      <label>Aspect Ratio</label>
      <select id="ratioInput">
        <option value="16:9">Landscape (16:9)</option>
        <option value="1:1">Square (1:1)</option>
        <option value="9:16">Portrait (9:16)</option>
        <option value="4:3">Standard (4:3)</option>
      </select>
    </div>

    <div class="field">
      <label>Character Prompt (Optional)</label>
      <textarea id="charPrompt" rows="2" placeholder="e.g., young cyber hacker with silver hair..."></textarea>
    </div>

    <div class="field">
      <label>Style Prompt (Optional)</label>
      <textarea id="stylePrompt" rows="2" placeholder="e.g., Cyberpunk neon concept art, 8k render..."></textarea>
    </div>

    <div class="field">
      <label>Image Prompts (One per line)</label>
      <textarea id="mainPrompts" rows="3" placeholder="Prompt 1...&#10;Prompt 2..."></textarea>
    </div>

    <button id="injectBtn" class="btn">INJECT INTO CANVAS</button>
  </div>

  <!-- Automation Mode -->
  <div id="automationContainer" class="hidden">
    <div class="automation-view">
      <div class="circle-wrapper" id="circleWrapper">
        <svg class="circle-svg" viewBox="0 0 100 100">
          <circle class="circle-bg" cx="50" cy="50" r="42"></circle>
          <circle class="circle-progress" id="circleProgress" cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="circle-center-text">
          <span class="circle-count" id="counterNumber">0</span>
          <span class="circle-status-text" id="counterStatusText">Idle</span>
        </div>
      </div>

      <div class="counter-details hidden" id="progressDetailRow">
        <div class="counter-item">
          <div class="c-title">Total</div>
          <div class="c-val" id="totalPromptsVal">0</div>
        </div>
        <div class="counter-item">
          <div class="c-title">Completed</div>
          <div class="c-val" id="completedPromptsVal">0</div>
        </div>
        <div class="counter-item">
          <div class="c-title">Remaining</div>
          <div class="c-val" id="remainingPromptsVal">0</div>
        </div>
      </div>
    </div>
  </div>

  <button id="stopBtn" class="btn-danger hidden">■ STOP GENERATION</button>

  <div id="logSection" class="log-container hidden">
    <label>Execution Logs</label>
    <div id="logBox" class="log"></div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h3 style="color:#10b981; margin-bottom: 8px;">Automation Settings</h3>
      <div class="field">
        <label>n8n Result Webhook URL</label>
        <input type="text" id="webhookUrlInput" placeholder="https://your-n8n.com/webhook/..." />
      </div>
      <div class="field">
        <label>Downloads Folder Path</label>
        <input type="text" id="downloadsPathInput" placeholder="C:\Users\PC\Downloads" />
      </div>
      <div style="display:flex; gap:6px; margin-top:12px;">
        <button id="saveWebhookBtn" class="btn" style="flex:1;">Save Settings</button>
        <button id="closeWebhookBtn" class="gear-btn" style="flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
